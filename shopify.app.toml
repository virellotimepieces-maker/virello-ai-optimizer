name = "virello-ai-optimizer"
# Live production app. Application URL is Vercel Production.

client_id = "99a9fda60d48cb24828f243360fffc40"

application_url = "https://virello-ai-optimizer.vercel.app"

embedded = true

[access_scopes]
scopes = "read_products,write_products"
# Standalone Connect uses authorization-code grant. Managed install rejects
# {shop}.myshopify.com/admin/oauth/authorize with Unauthorized Access.
use_legacy_install_flow = true

[auth]

redirect_urls = [
  "https://virello-ai-optimizer.vercel.app/api/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://virello-ai-optimizer.vercel.app/api/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "https://virello-ai-optimizer.vercel.app/api/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "https://virello-ai-optimizer.vercel.app/api/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "https://virello-ai-optimizer.vercel.app/api/webhooks/shop/redact"
