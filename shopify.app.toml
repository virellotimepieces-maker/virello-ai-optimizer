name = "virello-ai-optimizer"
# App Store listing app. One Shopify app per this production URL.

client_id = "059b113acaba78d855be9bc9500e421a"

application_url = "https://virello-ai-optimizer.vercel.app"

embedded = true

[access_scopes]
scopes = "read_products,write_products"
# Managed installation is required. Do not set use_legacy_install_flow.

[auth]

redirect_urls = [
  "https://virello-ai-optimizer.vercel.app/api/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

# App Store automated checks require compliance_topics on a CLI-released
# version. Use one HTTPS path per topic so the checker can probe each URL.
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/webhooks"

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "/api/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/api/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/api/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/api/webhooks/shop/redact"
